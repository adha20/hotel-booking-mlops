apiVersion: 1

groups:
  - orgId: 1
    name: hotel-booking-alerts
    folder: muhamadadha
    interval: 1m
    rules:
      - uid: hotel-traffic-high
        title: Hotel Booking - Total Request atau Prediction Tinggi
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              expr: max(max(hotel_booking_total_predictions) or sum(hotel_booking_requests_total{endpoint="/predict"}))
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [10000], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
              refId: C
              type: classic_conditions
        for: 1m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Total request atau prediction sudah melewati 10.000.
          description: Alert ini memantau lonjakan traffic/prediksi agar kapasitas layanan tetap terkendali.
        labels:
          severity: warning
          area: traffic

      - uid: hotel-latency-high
        title: Hotel Booking - High API Latency > 500 ms
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(hotel_booking_prediction_latency_seconds_bucket[5m])) by (le))
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0.5], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
              refId: C
              type: classic_conditions
        for: 1m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: P95 API latency lebih dari 500 ms.
          description: Alert ini memastikan layanan prediksi tetap responsif.
        labels:
          severity: warning
          area: api-monitoring

      - uid: hotel-error-rate-high
        title: Hotel Booking - High Error Rate > 5%
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              expr: 100 * sum(rate(hotel_booking_prediction_errors_total[5m])) / clamp_min(sum(rate(hotel_booking_requests_total{endpoint="/predict"}[5m])), 0.001)
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [5], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
              refId: C
              type: classic_conditions
        for: 1m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Error rate prediksi lebih dari 5%.
          description: Alert ini mengidentifikasi kegagalan layanan yang berdampak langsung pada pengguna.
        labels:
          severity: critical
          area: api-monitoring
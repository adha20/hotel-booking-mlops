name: Hotel Booking API CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "Workflow-CI/MLProject/**"
      - "Membangun_model/model_output_tuned/**"
      - "Membangun_model/hotel_bookings_preprocessing/test.csv"
      - "railway.json"
      - ".dockerignore"
      - ".github/workflows/api-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  API_IMAGE_LOCAL: hotel-booking-api:ci
  CT_MODEL_SOURCE: Workflow-CI/MLProject/model_output
  SAMPLE_DATA_SOURCE: Membangun_model/hotel_bookings_preprocessing/test.csv

jobs:
  train_build_push_image:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.push_image.outputs.image_name }}
      image_pushed: ${{ steps.push_image.outputs.image_pushed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CT dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas==2.2.3 numpy==2.2.1 scikit-learn==1.6.0 joblib==1.4.2

      - name: Run continuous training
        working-directory: Workflow-CI/MLProject
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: mlflow run . --env-manager=local

      - name: Validate CT model output
        run: |
          test -f "$CT_MODEL_SOURCE/model.joblib"
          test -f "$CT_MODEL_SOURCE/feature_columns.json"
          test -f "$CT_MODEL_SOURCE/label_mapping.json"

      - name: Build API Docker image with latest CT model
        run: |
          docker build \
            -f apps/api/Dockerfile \
            --build-arg MODEL_SOURCE="$CT_MODEL_SOURCE" \
            --build-arg SAMPLE_DATA_SOURCE="$SAMPLE_DATA_SOURCE" \
            -t "$API_IMAGE_LOCAL" \
            .

      - name: Push API image to Docker Hub
        id: push_image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Docker Hub secrets are not configured. Skipping image push."
            echo "image_pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IMAGE_NAME="$DOCKERHUB_USERNAME/hotel-booking-api:latest"
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker tag "$API_IMAGE_LOCAL" "$IMAGE_NAME"
          docker push "$IMAGE_NAME"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "image_pushed=true" >> "$GITHUB_OUTPUT"

  deploy_railway_image:
    runs-on: ubuntu-latest
    needs: train_build_push_image
    if: needs.train_build_push_image.outputs.image_pushed == 'true'
    container:
      image: ghcr.io/railwayapp/cli:latest

    steps:
      - name: Connect Railway service to latest Docker image
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          IMAGE_NAME: ${{ needs.train_build_push_image.outputs.image_name }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_SERVICE" ]; then
            echo "Railway secrets are incomplete. Configure RAILWAY_TOKEN, RAILWAY_PROJECT_ID, and RAILWAY_SERVICE to enable deployment."
            exit 0
          fi
          TARGET_ENVIRONMENT="${RAILWAY_ENVIRONMENT:-production}"
          railway link --project "$RAILWAY_PROJECT_ID" --environment "$TARGET_ENVIRONMENT"
          railway service source connect --image "$IMAGE_NAME" --service "$RAILWAY_SERVICE"
          railway service redeploy --service "$RAILWAY_SERVICE"
